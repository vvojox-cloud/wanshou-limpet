<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動進程｜萬壽社區</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f0faf4; color: #1a1a1a; padding-bottom: 90px; }

  .header {
    background: #1a6b4a;
    color: white;
    padding: 20px 16px 16px;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
  }
  .header h1 { font-size: 20px; margin-bottom: 4px; }
  .header p { font-size: 13px; opacity: 0.85; }

  .date-bar {
    background: #155c3e;
    color: #a8e6c8;
    text-align: center;
    padding: 8px;
    font-size: 13px;
    letter-spacing: 0.05em;
  }

  .container { padding: 16px; max-width: 480px; margin: 0 auto; }

  /* ── 狀態橫幅（倒數 / 未開始 / 已結束）── */
  .phase-card {
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    text-align: center;
    border: 1.5px solid #86efac;
    background: #ffffff;
  }
  .phase-card .ph-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; }
  .phase-card .ph-main  { font-size: 19px; font-weight: 700; color: #1a6b4a; margin-bottom: 4px; }
  .phase-card .ph-sub   { font-size: 13px; color: #555; line-height: 1.6; }
  .phase-card.gray  { border-color: #d1d5db; }
  .phase-card.gray .ph-main { color: #6b7280; }

  /* ── 進度條 ── */
  .prog-wrap { margin-bottom: 14px; }
  .prog-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 12px; color: #6b7280; margin-bottom: 6px;
  }
  .prog-bar { height: 8px; background: #d1fae5; border-radius: 20px; overflow: hidden; }
  .prog-fill { height: 100%; background: #1a6b4a; border-radius: 20px; transition: width 0.4s; width: 0; }

  /* ── 安全燈號 ── */
  .safety-card {
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .safety-card.green  { background: #dcfce7; border: 1.5px solid #16a34a; }
  .safety-card.yellow { background: #fef9c3; border: 1.5px solid #ca8a04; }
  .safety-card.red    { background: #fee2e2; border: 1.5px solid #dc2626; }
  .safety-dot { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; }
  .safety-card.green  .safety-dot { background: #16a34a; }
  .safety-card.yellow .safety-dot { background: #ca8a04; }
  .safety-card.red    .safety-dot { background: #dc2626; }
  .safety-text strong { font-size: 15px; display: block; margin-bottom: 2px; }
  .safety-text span   { font-size: 12px; color: #555; }

  /* ── 主持人公告 ── */
  .notice {
    background: #eff6ff;
    border: 1.5px solid #60a5fa;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    color: #1e40af;
    line-height: 1.6;
  }
  .notice b { display: block; font-size: 11px; opacity: 0.8; margin-bottom: 3px; }

  /* ── 時間軸 ── */
  .timeline { position: relative; padding-left: 32px; }
  .timeline::before {
    content: '';
    position: absolute;
    left: 10px; top: 0; bottom: 0;
    width: 2px;
    background: #d1fae5;
  }

  .step {
    position: relative;
    margin-bottom: 12px;
    background: white;
    border-radius: 10px;
    padding: 12px 14px;
    border: 1.5px solid #e5e7eb;
    transition: border-color 0.2s;
    scroll-margin-top: 100px;
  }
  .step.done    { border-color: #86efac; background: #f0fdf4; }
  .step.current { border-color: #1a6b4a; background: #ecfdf5; box-shadow: 0 2px 8px #1a6b4a22; }
  .step.upcoming{ border-color: #e5e7eb; opacity: 0.7; }

  .step-dot {
    position: absolute;
    left: -26px; top: 14px;
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 2px solid white;
  }
  .step.done     .step-dot { background: #16a34a; }
  .step.current  .step-dot { background: #1a6b4a; box-shadow: 0 0 0 3px #bbf7d0; }
  .step.upcoming .step-dot { background: #d1d5db; }

  .step-time { font-size: 11px; color: #6b7280; margin-bottom: 3px; }
  .step-title { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
  .step-desc  { font-size: 12px; color: #555; line-height: 1.5; }
  .step.current .step-title { color: #1a6b4a; }

  .current-badge {
    display: inline-block;
    background: #1a6b4a;
    color: white;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 20px;
    margin-bottom: 4px;
  }
  .done-badge {
    display: inline-block;
    background: #dcfce7;
    color: #166534;
    font-size: 11px;
    padding: 1px 8px;
    border-radius: 20px;
    margin-bottom: 4px;
  }

  /* ── 未來場次清單 ── */
  .next-list { margin-top: 18px; }
  .next-list h3 { font-size: 13px; color: #1a6b4a; margin-bottom: 8px; }
  .next-item {
    background: white; border: 1.5px solid #e5e7eb; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px;
  }
  .next-item .ni-date { font-weight: 600; color: #1a6b4a; }
  .next-item .ni-days { font-size: 12px; color: #6b7280; }

  /* ── 緊急聯絡 ── */
  .emergency {
    margin-top: 20px;
    background: #fff7ed;
    border: 1.5px solid #fb923c;
    border-radius: 10px;
    padding: 12px 14px;
  }
  .emergency h3 { font-size: 13px; color: #c2410c; margin-bottom: 8px; }
  .emergency a {
    display: block;
    font-size: 16px;
    font-weight: 700;
    color: #c2410c;
    text-decoration: none;
    margin-bottom: 4px;
  }

  .update-bar {
    text-align: center;
    font-size: 11px;
    color: #9ca3af;
    padding: 16px 0 24px;
    line-height: 1.6;
  }
  .sync-dot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:4px; vertical-align:middle; }
  .sync-dot.on  { background:#16a34a; }
  .sync-dot.off { background:#d1d5db; }
  .sync-dot.err { background:#dc2626; }

  /* ════════════ 主持人控制面板 ════════════ */
  .host-panel {
    position: fixed;
    left: 0; right: 0; bottom: 62px;
    background: #0f2f22;
    color: #d1fae5;
    z-index: 95;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.25);
    max-height: 72vh;
    overflow-y: auto;
    display: none;
  }
  .host-panel.open { display: block; }
  .hp-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px; background: #14472f; font-size: 13px; font-weight: 700;
    position: sticky; top: 0;
  }
  .hp-close { background: none; border: none; color: #a8e6c8; font-size: 20px; cursor: pointer; line-height: 1; }
  .hp-body { padding: 12px 14px 16px; }
  .hp-sec { margin-bottom: 14px; }
  .hp-sec > label { display: block; font-size: 11px; color: #86efac; margin-bottom: 6px; letter-spacing: .05em; }
  .hp-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .hp-btn {
    flex: 1; min-width: 72px;
    background: #1a6b4a; color: #fff; border: 1.5px solid #2f8b64;
    border-radius: 8px; padding: 10px 8px; font-size: 13px; font-weight: 600;
    cursor: pointer;
  }
  .hp-btn:active { transform: scale(0.97); }
  .hp-btn.ghost { background: transparent; color: #a8e6c8; }
  .hp-btn.on { background: #a8e6c8; color: #0f2f22; border-color: #a8e6c8; }
  .hp-btn.red    { background:#dc2626; border-color:#ef4444; }
  .hp-btn.yellow { background:#ca8a04; border-color:#eab308; }
  .hp-btn.green  { background:#16a34a; border-color:#22c55e; }
  .hp-select, .hp-input {
    width: 100%; padding: 10px; border-radius: 8px; font-size: 14px;
    border: 1.5px solid #2f8b64; background: #0b241a; color: #e7fff3;
  }
  .hp-status { font-size: 12px; color: #86efac; margin-top: 4px; line-height: 1.6; }

  /* 面板分頁 */
  .hp-tabs { display: flex; gap: 6px; padding: 10px 14px 0; }
  .hp-tab {
    flex: 1; padding: 9px 6px; text-align: center; font-size: 13px; font-weight: 600;
    background: #14472f; color: #86efac; border: 1.5px solid #2f8b64;
    border-radius: 8px; cursor: pointer;
  }
  .hp-tab.on { background: #a8e6c8; color: #0f2f22; border-color: #a8e6c8; }
  .hp-pane { display: none; }
  .hp-pane.on { display: block; }

  /* 編輯器 */
  .ed-block {
    background: #0b241a; border: 1.5px solid #2f8b64; border-radius: 10px;
    padding: 10px; margin-bottom: 10px;
  }
  .ed-line { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .ed-line:last-child { margin-bottom: 0; }
  .ed-num {
    width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
    background: #1a6b4a; color: #fff; font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .ed-in {
    flex: 1; min-width: 0; padding: 8px; border-radius: 6px; font-size: 14px;
    border: 1.5px solid #2f8b64; background: #06170f; color: #e7fff3;
  }
  .ed-in.time { flex: 1 1 0; min-width: 0; padding: 8px 4px; text-align: center; }
  .ed-in.small { font-size: 12px; }
  .ed-mini {
    flex-shrink: 0; width: 32px; height: 32px; padding: 0;
    background: #14472f; color: #a8e6c8; border: 1.5px solid #2f8b64;
    border-radius: 6px; font-size: 14px; cursor: pointer;
  }
  .ed-mini.del { color: #fca5a5; border-color: #7f1d1d; }
  .ed-sep { color: #86efac; font-size: 13px; flex-shrink: 0; }
  .ed-add {
    width: 100%; padding: 10px; background: transparent; color: #a8e6c8;
    border: 1.5px dashed #2f8b64; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; margin-bottom: 12px;
  }
  .ed-save {
    position: sticky; bottom: 0; background: #0f2f22;
    padding: 10px 0 4px; margin-top: 4px;
  }
  .ed-hint { font-size: 11px; color: #6ee7b7; line-height: 1.6; margin-bottom: 8px; }
  .hp-mode {
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
    background:#a8e6c8; color:#0f2f22; font-weight:700;
  }
  .hp-mode.manual { background:#fbbf24; }

  /* PIN 登入 */
  .pin-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 120; padding: 24px;
  }
  .pin-overlay.open { display: flex; }
  .pin-box { background: white; border-radius: 14px; padding: 20px; width: 100%; max-width: 300px; text-align: center; }
  .pin-box h3 { font-size: 15px; color: #1a6b4a; margin-bottom: 12px; }
  .pin-box input {
    width: 100%; padding: 12px; font-size: 20px; text-align: center; letter-spacing: .3em;
    border: 1.5px solid #d1d5db; border-radius: 8px; margin-bottom: 12px;
  }
  .pin-box button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .pin-box .ok { background: #1a6b4a; color: white; margin-bottom: 8px; }
  .pin-box .cancel { background: #f3f4f6; color: #6b7280; }
  .pin-err { color: #dc2626; font-size: 12px; min-height: 16px; margin-bottom: 8px; }
</style>
</head>
<body>

<div class="header" id="pageHeader">
  <h1 id="pageTitle">🐚 中角灣笠螺採集體驗</h1>
  <p>萬壽社區發展協會 · 活動進程追蹤</p>
</div>

<div class="date-bar" id="dateBar">載入中...</div>

<div class="container">

  <div id="phaseSlot"></div>

  <div class="prog-wrap" id="progWrap" style="display:none;">
    <div class="prog-head">
      <span id="progLabel">活動進度</span>
      <span id="progCount"></span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>

  <div class="safety-card" id="safetyCard">
    <div class="safety-dot"></div>
    <div class="safety-text">
      <strong id="safetyTitle">確認海況中...</strong>
      <span id="safetyDesc">請稍候</span>
    </div>
  </div>

  <div class="notice" id="noticeBox" style="display:none;">
    <b>📢 主持人公告</b>
    <span id="noticeText"></span>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="next-list" id="nextList" style="display:none;">
    <h3>📅 接下來的場次</h3>
    <div id="nextItems"></div>
  </div>

  <div class="emergency">
    <h3>緊急聯絡</h3>
    <a href="tel:118">海巡署 118</a>
    <a href="tel:0958565930">活動負責人：趙理事長 0958-565-930</a>
  </div>

</div>

<div class="update-bar" id="updateBar">載入中...</div>

<!-- ════════════ 主持人控制面板 ════════════ -->
<div class="host-panel" id="hostPanel">
  <div class="hp-head">
    <span>🎛️ 主持人控制台 <span class="hp-mode" id="hpMode">自動</span></span>
    <button class="hp-close" onclick="closeHost()">×</button>
  </div>
  <div class="hp-tabs">
    <div class="hp-tab on" id="tabLive"  onclick="hpTab('live')">🎬 現場控制</div>
    <div class="hp-tab"    id="tabEdit"  onclick="hpTab('edit')">✏️ 編輯活動</div>
  </div>

  <div class="hp-body hp-pane on" id="paneLive">

    <div class="hp-sec">
      <label>目前階段（手動指定後會同步給所有人）</label>
      <select class="hp-select" id="hpStepSelect" onchange="hostSetStep(this.value)"></select>
      <div class="hp-row" style="margin-top:8px;">
        <button class="hp-btn" onclick="hostStep(-1)">◀ 上一階段</button>
        <button class="hp-btn" onclick="hostStep(1)">下一階段 ▶</button>
      </div>
    </div>

    <div class="hp-sec">
      <label>整體時間平移（例如活動延後開始）</label>
      <div class="hp-row">
        <button class="hp-btn ghost" onclick="hostOffset(-10)">－10 分</button>
        <button class="hp-btn ghost" onclick="hostOffset(10)">＋10 分</button>
        <button class="hp-btn ghost" onclick="hostOffset(30)">＋30 分</button>
      </div>
      <div class="hp-status" id="hpOffsetInfo">目前平移：0 分鐘</div>
    </div>

    <div class="hp-sec">
      <label>安全燈號</label>
      <div class="hp-row">
        <button class="hp-btn green"  onclick="hostSafety('green')">🟢 良好</button>
        <button class="hp-btn yellow" onclick="hostSafety('yellow')">🟡 注意</button>
        <button class="hp-btn red"    onclick="hostSafety('red')">🔴 停止</button>
      </div>
    </div>

    <div class="hp-sec">
      <label>臨時公告（留白則不顯示）</label>
      <input class="hp-input" id="hpNotice" placeholder="例：因下雨，採集延後 20 分鐘">
      <div class="hp-row" style="margin-top:8px;">
        <button class="hp-btn" onclick="hostNotice()">發布公告</button>
        <button class="hp-btn ghost" onclick="hostClearNotice()">清除公告</button>
      </div>
    </div>

    <div class="hp-sec">
      <label>今天不是預排的活動日時</label>
      <div class="hp-row">
        <button class="hp-btn ghost" id="hpForceBtn" onclick="hostToggleForce()">▶ 今天強制開跑</button>
      </div>
    </div>

    <div class="hp-sec">
      <div class="hp-row">
        <button class="hp-btn ghost" onclick="hostReset()">↺ 全部恢復自動</button>
      </div>
      <div class="hp-status" id="hpSyncInfo"></div>
    </div>

  </div>

  <!-- ── 編輯活動 ── -->
  <div class="hp-body hp-pane" id="paneEdit">

    <div class="hp-sec">
      <label>活動場次日期（可以排很多場）</label>
      <div class="ed-hint">改好日期後記得按最下面的「儲存並同步」。時間可以是上午或下午，用 24 小時制。</div>
      <div id="edEvents"></div>
      <button class="ed-add" onclick="edAddEvent()">＋ 新增一場</button>
    </div>

    <div class="hp-sec">
      <label>活動流程（所有場次共用）</label>
      <div id="edSteps"></div>
      <button class="ed-add" onclick="edAddStep()">＋ 新增一個階段</button>
    </div>

    <div class="ed-save">
      <div class="hp-row">
        <button class="hp-btn" onclick="edSave()">💾 儲存並同步</button>
        <button class="hp-btn ghost" onclick="edLoad()">取消變更</button>
      </div>
      <div class="hp-row" style="margin-top:8px;">
        <button class="hp-btn ghost" onclick="edRestoreDefault()">↺ 還原成程式碼預設</button>
      </div>
      <div class="hp-status" id="edMsg"></div>
    </div>

  </div>
</div>

<!-- PIN 登入 -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-box">
    <h3>🎛️ 主持人模式</h3>
    <input type="tel" id="pinInput" maxlength="8" placeholder="輸入密碼" inputmode="numeric">
    <div class="pin-err" id="pinErr"></div>
    <button class="ok" onclick="checkPin()">進入</button>
    <button class="cancel" onclick="closePin()">取消</button>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   ★★★ 講師 / 主持人修改區 ★★★
   只要改這一段，其他都不用動
   ═══════════════════════════════════════════════════════════ */

// ── ① 活動場次日期（可以放很多場，網頁會自動比對「今天」）────
//     格式：{ date: '西元年-月-日', name: '場次名稱' }
//     過去的場次可以留著不用刪，網頁會自動略過
//     ※ 主持人也可以直接在網頁上的「✏️ 編輯活動」修改，不必動這裡
const EVENTS_DEFAULT = [
  { date: '2026-07-20', name: '中角灣笠螺採集體驗' },
  // { date: '2026-10-18', name: '中角灣笠螺採集體驗' },   // ← 複製這行、改日期，就多一場
  // { date: '2026-11-15', name: '中角灣笠螺採集體驗' },
];

// ── ② 每一場的活動流程（所有場次共用）────────────────────
//     start / end 用 24 小時制，格式 '時:分'（上午場就寫 '09:00' 這樣）
//     ※ 主持人也可以直接在網頁上的「✏️ 編輯活動」修改，不必動這裡
const SCHEDULE_DEFAULT = [
  { start: '13:00', end: '13:30',
    title: '報到 · 掃碼進入活動頁面',
    desc:  '領取名牌，工作人員協助長者操作手機' },

  { start: '13:30', end: '14:00',
    title: '笠螺文化介紹 · 海洋安全教育',
    desc:  '江淑珍講師主講，說明潮汐安全燈號使用方式' },

  { start: '14:00', end: '15:30',
    title: '🌊 中角灣潮間帶採集體驗',
    desc:  '低潮黃金採集時段！長者文化嚮導帶領，請穿防滑鞋' },

  { start: '15:30', end: '16:00',
    title: '淨灘行動',
    desc:  '廢棄物分類統計，用手機填寫淨灘回報表' },

  { start: '16:00', end: '16:30',
    title: '笠螺料理 DIY',
    desc:  '社區志工媽媽示範傳統醃漬作法，現場試吃' },

  { start: '16:30', end: '17:00',
    title: '成果分享 · 填寫回饋問卷',
    desc:  '個人採集記錄表填寫，生成你的體驗成果卡' },

  { start: '17:00', end: '17:30',
    title: '回饋與展望',
    desc:  '感謝參與！宣傳下一場活動資訊' },
];

// ── ③ 預設安全燈號（主持人可在現場用控制台即時改）────────
const SAFETY_PRESET = {
  green:  { title: '採集條件良好', desc: '今日潮位適合，浪況平穩，請跟隨講師進行採集' },
  yellow: { title: '請特別注意',   desc: '浪況或潮位變化中，請留在講師視線範圍內' },
  red:    { title: '暫停採集',     desc: '請立即回到岸上，聽從工作人員指示' },
};
const SAFETY_DEFAULT_LEVEL = 'green';

// ── ④ 主持人控制台密碼 ────────────────────────────────
const HOST_PIN = '2026';

// ── ⑤ 雲端同步網址（貼上 Google Apps Script 的 /exec 網址）──
//     留空 = 只在主持人自己手機上生效
//     填入 = 主持人一按，現場所有人的手機都會跟著更新
const SYNC_URL = '';

/* ═══════════════════════════════════════════════════════════
   以下不需要修改
   ═══════════════════════════════════════════════════════════ */

const LS_KEY = 'ws_activity_state_v1';
const WEEK = ['日','一','二','三','四','五','六'];

let state = {
  mode: 'auto',        // auto | manual
  stepIndex: 0,
  offsetMin: 0,
  forceToday: '',      // 'YYYY-MM-DD' 或 ''
  safety: null,        // {level} 或 null（用預設）
  notice: '',
  events: null,        // 主持人在網頁上改過的場次；null = 用程式碼預設
  schedule: null,      // 主持人在網頁上改過的流程；null = 用程式碼預設
  updatedAt: 0,
};
let isHost = false;
let syncStatus = SYNC_URL ? 'connecting' : 'off';

// 實際使用的資料（主持人編輯過就用編輯後的）
let EVENTS = EVENTS_DEFAULT.slice();
let SCHEDULE = SCHEDULE_DEFAULT.slice();
function applyState() {
  EVENTS   = Array.isArray(state.events) ? state.events : EVENTS_DEFAULT;
  SCHEDULE = (state.schedule && state.schedule.length) ? state.schedule : SCHEDULE_DEFAULT;
  if (state.stepIndex > SCHEDULE.length - 1) state.stepIndex = SCHEDULE.length - 1;
  if (state.stepIndex < 0) state.stepIndex = 0;
}

/* ── 台北時間 ────────────────────────────────────────── */
function tpNow() {
  const f = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Taipei', year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
  });
  const p = {};
  f.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return {
    date: `${p.year}-${p.month}-${p.day}`,
    min: (+p.hour) * 60 + (+p.minute),
    hh: p.hour, mm: p.minute
  };
}
function toMin(hhmm) { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; }
function fmtMin(m) {
  m = ((m % 1440) + 1440) % 1440;
  return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
}
function dateNum(d) { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); }
function daysBetween(a, b) { return Math.round((dateNum(b) - dateNum(a)) / 86400000); }
function weekdayOf(d) { return WEEK[new Date(dateNum(d)).getUTCDay()]; }
function prettyDate(d) { const [y, m, dd] = d.split('-'); return `${+m}月${+dd}日（${weekdayOf(d)}）`; }

/* ── 狀態存取 ────────────────────────────────────────── */
function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
}
function saveLocal() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
}
function touch() { state.updatedAt = Date.now(); saveLocal(); pushRemote(); render(); }

/* ── 雲端同步 ────────────────────────────────────────── */
async function pullRemote() {
  if (!SYNC_URL) return;
  try {
    const res = await fetch(SYNC_URL + '?key=activity_state&t=' + Date.now(), { cache: 'no-store' });
    const remote = await res.json();
    syncStatus = 'on';
    if (remote && remote.updatedAt && remote.updatedAt > (state.updatedAt || 0)) {
      state = Object.assign(state, remote);
      saveLocal();
      render();
    } else {
      renderSyncBar();
    }
  } catch (e) {
    syncStatus = 'err';
    renderSyncBar();
  }
}
async function pushRemote() {
  if (!SYNC_URL || !isHost) return;
  try {
    await fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ pin: HOST_PIN, key: 'activity_state', value: state })
    });
    syncStatus = 'on';
  } catch (e) {
    syncStatus = 'err';
  }
  renderSyncBar();
}

/* ── 找出今天要顯示哪一場 ───────────────────────────── */
function resolveEvent(today) {
  const list = EVENTS.slice().sort((a, b) => a.date < b.date ? -1 : 1);

  if (state.forceToday === today) {
    return { phase: 'live', ev: { date: today, name: EVENTS[0] ? EVENTS[0].name : '活動進行中' }, list };
  }
  const hit = list.find(e => e.date === today);
  if (hit) return { phase: 'live', ev: hit, list };

  const next = list.find(e => e.date > today);
  if (next) return { phase: 'before', ev: next, list };

  if (list.length) return { phase: 'after', ev: list[list.length - 1], list };
  return { phase: 'none', ev: null, list };
}

/* ── 主渲染 ──────────────────────────────────────────── */
function render() {
  applyState();
  const now = tpNow();
  const { phase, ev, list } = resolveEvent(now.date);
  const off = state.offsetMin || 0;

  // 標題（跟著場次名稱走）
  if (ev && ev.name) document.getElementById('pageTitle').textContent = '🐚 ' + ev.name;

  // 日期列
  const dateBar = document.getElementById('dateBar');
  if (phase === 'live') {
    dateBar.textContent = `${ev.date}（${weekdayOf(ev.date)}）· 中角灣 · 活動日`;
  } else if (phase === 'before') {
    dateBar.textContent = `今天 ${now.date}（${weekdayOf(now.date)}）· 下一場 ${prettyDate(ev.date)}`;
  } else {
    dateBar.textContent = `今天 ${now.date}（${weekdayOf(now.date)}）· 中角灣 · 萬壽社區`;
  }

  // 計算階段狀態
  const startMins = SCHEDULE.map(s => toMin(s.start) + off);
  const endMins = SCHEDULE.map(s => toMin(s.end) + off);
  let curIdx = -1;          // -1 = 尚未開始，SCHEDULE.length = 已結束
  let inGap = false;        // 兩個階段之間的空檔（例如中間休息）
  if (phase === 'live') {
    if (state.mode === 'manual') {
      curIdx = Math.max(0, Math.min(SCHEDULE.length - 1, state.stepIndex));
    } else {
      if (now.min < startMins[0]) curIdx = -1;
      else if (now.min >= endMins[endMins.length - 1]) curIdx = SCHEDULE.length;
      else {
        curIdx = SCHEDULE.findIndex((s, i) => now.min < endMins[i]);
        if (curIdx < 0) curIdx = SCHEDULE.length;
        else if (now.min < startMins[curIdx]) inGap = true;
      }
    }
  }

  // 狀態橫幅
  const slot = document.getElementById('phaseSlot');
  let html = '';
  if (phase === 'none') {
    html = `<div class="phase-card gray">
      <div class="ph-label">活動進程</div>
      <div class="ph-main">目前尚未安排場次</div>
      <div class="ph-sub">新場次確定後會在這裡公布，歡迎先加 LINE 追蹤</div></div>`;
  } else if (phase === 'before') {
    const d = daysBetween(now.date, ev.date);
    html = `<div class="phase-card">
      <div class="ph-label">下一場活動</div>
      <div class="ph-main">${prettyDate(ev.date)}</div>
      <div class="ph-sub">${d === 1 ? '就在明天！' : `還有 ${d} 天`}　·　${SCHEDULE[0].start} 開始報到<br>下方是當天的完整流程</div></div>`;
  } else if (phase === 'after') {
    const d = daysBetween(ev.date, now.date);
    html = `<div class="phase-card gray">
      <div class="ph-label">最近一場活動</div>
      <div class="ph-main">已於 ${prettyDate(ev.date)} 圓滿結束</div>
      <div class="ph-sub">${d} 天前　·　下一場活動籌備中，敬請期待</div></div>`;
  } else if (curIdx === -1) {
    const wait = startMins[0] - now.min;
    html = `<div class="phase-card">
      <div class="ph-label">今天是活動日 🎉</div>
      <div class="ph-main">${fmtMin(startMins[0])} 開始報到</div>
      <div class="ph-sub">還有 ${Math.floor(wait / 60)} 小時 ${wait % 60} 分鐘${off ? `　·　已整體延後 ${off} 分鐘` : ''}</div></div>`;
  } else if (curIdx >= SCHEDULE.length) {
    html = `<div class="phase-card">
      <div class="ph-label">今日活動</div>
      <div class="ph-main">已圓滿結束，感謝參與 🐚</div>
      <div class="ph-sub">別忘了填寫回饋問卷，我們下次見！</div></div>`;
  } else if (inGap) {
    const wait = startMins[curIdx] - now.min;
    html = `<div class="phase-card">
      <div class="ph-label">中場休息</div>
      <div class="ph-main">下一階段：${SCHEDULE[curIdx].title}</div>
      <div class="ph-sub">${fmtMin(startMins[curIdx])} 開始，還有 ${wait} 分鐘${off ? `　·　已整體延後 ${off} 分鐘` : ''}</div></div>`;
  } else {
    const left = endMins[curIdx] - now.min;
    html = `<div class="phase-card">
      <div class="ph-label">現在進行中（第 ${curIdx + 1} / ${SCHEDULE.length} 階段）</div>
      <div class="ph-main">${SCHEDULE[curIdx].title}</div>
      <div class="ph-sub">${state.mode === 'manual'
        ? '主持人手動指定中'
        : `距離下一階段還有 ${left} 分鐘`}${off ? `　·　已整體延後 ${off} 分鐘` : ''}</div></div>`;
  }
  slot.innerHTML = html;

  // 進度條
  const pw = document.getElementById('progWrap');
  if (phase === 'live') {
    pw.style.display = 'block';
    const doneCount = Math.max(0, Math.min(SCHEDULE.length, curIdx));
    document.getElementById('progCount').textContent = `${doneCount} / ${SCHEDULE.length} 階段完成`;
    document.getElementById('progFill').style.width = (doneCount / SCHEDULE.length * 100) + '%';
  } else {
    pw.style.display = 'none';
  }

  // 安全燈號（活動日才顯示）
  const card = document.getElementById('safetyCard');
  if (phase === 'live') {
    card.style.display = 'flex';
    const lv = (state.safety && state.safety.level) || SAFETY_DEFAULT_LEVEL;
    const p = SAFETY_PRESET[lv] || SAFETY_PRESET.green;
    card.className = 'safety-card ' + lv;
    document.getElementById('safetyTitle').textContent = p.title;
    document.getElementById('safetyDesc').textContent = p.desc;
  } else {
    card.style.display = 'none';
  }

  // 公告
  const nb = document.getElementById('noticeBox');
  if (state.notice) {
    nb.style.display = 'block';
    document.getElementById('noticeText').textContent = state.notice;
  } else {
    nb.style.display = 'none';
  }

  // 時間軸
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  if (phase !== 'none') {
    SCHEDULE.forEach((s, i) => {
      let st;
      if (phase !== 'live') st = 'upcoming';
      else if (i < curIdx) st = 'done';
      else if (i === curIdx) st = inGap ? 'upcoming' : 'current';
      else st = 'upcoming';

      const div = document.createElement('div');
      div.className = 'step ' + st;
      if (st === 'current') div.id = 'currentStep';
      div.innerHTML =
        '<div class="step-dot"></div>' +
        (st === 'current' ? '<span class="current-badge">▶ 進行中</span>' : '') +
        (st === 'done' ? '<span class="done-badge">✓ 已完成</span>' : '') +
        `<div class="step-time">${fmtMin(toMin(s.start) + off)} - ${fmtMin(toMin(s.end) + off)}</div>` +
        `<div class="step-title">${s.title}</div>` +
        `<div class="step-desc">${s.desc}</div>`;
      tl.appendChild(div);
    });
  }

  // 未來場次清單
  const nl = document.getElementById('nextList');
  const future = list.filter(e => e.date > now.date);
  if (future.length && phase !== 'live') {
    nl.style.display = 'block';
    document.getElementById('nextItems').innerHTML = future.slice(0, 4).map(e =>
      `<div class="next-item"><span class="ni-date">${prettyDate(e.date)}</span>
       <span class="ni-days">還有 ${daysBetween(now.date, e.date)} 天</span></div>`).join('');
  } else {
    nl.style.display = 'none';
  }

  renderSyncBar();
  renderHostPanel(curIdx);

  // 自動捲到進行中的階段（只捲一次）
  if (!render._scrolled && phase === 'live') {
    const cur = document.getElementById('currentStep');
    if (cur) { render._scrolled = true; setTimeout(() => cur.scrollIntoView({ behavior: 'smooth', block: 'center' }), 400); }
  }
}

function renderSyncBar() {
  const now = tpNow();
  let sync;
  if (!SYNC_URL) sync = '<span class="sync-dot off"></span>本機模式';
  else if (syncStatus === 'on') sync = '<span class="sync-dot on"></span>已連線同步';
  else if (syncStatus === 'err') sync = '<span class="sync-dot err"></span>同步異常';
  else sync = '<span class="sync-dot off"></span>連線中...';

  document.getElementById('updateBar').innerHTML =
    `最後更新：${now.hh}:${now.mm} · 每分鐘自動更新<br>${sync}` +
    (state.mode === 'manual' ? ' · 主持人手動控制中' : '');
}

/* ── 主持人控制台 ───────────────────────────────────── */
function renderHostPanel(curIdx) {
  if (!isHost) return;
  const sel = document.getElementById('hpStepSelect');
  const want = state.mode === 'manual' ? state.stepIndex : Math.max(0, Math.min(SCHEDULE.length - 1, curIdx));
  const sig = SCHEDULE.map(s => s.start + s.title).join('|');
  if (sel.dataset.sig !== sig) {
    sel.innerHTML = SCHEDULE.map((s, i) => `<option value="${i}">${i + 1}. ${s.start} ${s.title}</option>`).join('');
    sel.dataset.sig = sig;
  }
  sel.value = want;
  const m = document.getElementById('hpMode');
  m.textContent = state.mode === 'manual' ? '手動' : '自動';
  m.className = 'hp-mode' + (state.mode === 'manual' ? ' manual' : '');
  document.getElementById('hpOffsetInfo').textContent = `目前平移：${state.offsetMin || 0} 分鐘`;
  document.getElementById('hpForceBtn').classList.toggle('on', state.forceToday === tpNow().date);
  document.getElementById('hpSyncInfo').textContent =
    SYNC_URL ? (syncStatus === 'on' ? '✅ 已同步給現場所有人' : '⚠️ 同步連線異常，目前只在本機生效')
             : 'ℹ️ 尚未設定雲端同步，變更只在這支手機上生效';
}

function hostSetStep(v) { state.mode = 'manual'; state.stepIndex = +v; touch(); }
function hostStep(d) {
  const now = tpNow();
  if (state.mode !== 'manual') {
    // 從自動切手動時，先接續目前階段
    const off = state.offsetMin || 0;
    let i = SCHEDULE.findIndex((s, k) => now.min < toMin(SCHEDULE[k].end) + off);
    if (i < 0) i = SCHEDULE.length - 1;
    state.stepIndex = i;
    state.mode = 'manual';
  }
  state.stepIndex = Math.max(0, Math.min(SCHEDULE.length - 1, state.stepIndex + d));
  touch();
}
function hostOffset(d) { state.offsetMin = (state.offsetMin || 0) + d; touch(); }
function hostSafety(lv) { state.safety = { level: lv }; touch(); }
function hostNotice() {
  state.notice = document.getElementById('hpNotice').value.trim();
  touch();
}
function hostClearNotice() { state.notice = ''; document.getElementById('hpNotice').value = ''; touch(); }
function hostToggleForce() {
  const t = tpNow().date;
  state.forceToday = (state.forceToday === t) ? '' : t;
  render._scrolled = false;
  touch();
}
function hostReset() {
  // 只把「現場控制」歸零，主持人編輯過的日期/流程保留
  state.mode = 'auto';
  state.stepIndex = 0;
  state.offsetMin = 0;
  state.forceToday = '';
  state.safety = null;
  state.notice = '';
  const n = document.getElementById('hpNotice'); if (n) n.value = '';
  render._scrolled = false;
  touch();
}

/* ═══════════ 編輯活動（日期 / 時間 / 項目）═══════════ */
let edEvents = [];
let edSteps = [];

function hpTab(which) {
  const live = which === 'live';
  document.getElementById('tabLive').classList.toggle('on', live);
  document.getElementById('tabEdit').classList.toggle('on', !live);
  document.getElementById('paneLive').classList.toggle('on', live);
  document.getElementById('paneEdit').classList.toggle('on', !live);
  if (!live) edLoad();
}

/** 從目前狀態載入到編輯器 */
function edLoad() {
  applyState();
  edEvents = EVENTS.map(e => ({ date: e.date, name: e.name || '' }));
  edSteps = SCHEDULE.map(s => ({ start: s.start, end: s.end, title: s.title, desc: s.desc || '' }));
  edRender();
  edMsg('');
}

/** 把畫面上輸入框的值收回陣列（在重畫或儲存前一定要先做） */
function edCollect() {
  document.querySelectorAll('#edEvents .ed-block').forEach((b, i) => {
    if (!edEvents[i]) return;
    edEvents[i].date = b.querySelector('.ev-date').value;
    edEvents[i].name = b.querySelector('.ev-name').value;
  });
  document.querySelectorAll('#edSteps .ed-block').forEach((b, i) => {
    if (!edSteps[i]) return;
    edSteps[i].start = b.querySelector('.st-start').value;
    edSteps[i].end = b.querySelector('.st-end').value;
    edSteps[i].title = b.querySelector('.st-title').value;
    edSteps[i].desc = b.querySelector('.st-desc').value;
  });
}

function esc(s) { return String(s == null ? '' : s).replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

function edRender() {
  document.getElementById('edEvents').innerHTML = edEvents.map((e, i) => `
    <div class="ed-block">
      <div class="ed-line">
        <span class="ed-num">${i + 1}</span>
        <input type="date" class="ed-in ev-date" value="${esc(e.date)}">
        <button class="ed-mini del" onclick="edDelEvent(${i})" title="刪除">✕</button>
      </div>
      <div class="ed-line">
        <input type="text" class="ed-in small ev-name" placeholder="場次名稱（可留白）" value="${esc(e.name)}">
      </div>
    </div>`).join('') || '<div class="ed-hint">目前沒有場次，按下面「＋ 新增一場」。</div>';

  document.getElementById('edSteps').innerHTML = edSteps.map((s, i) => `
    <div class="ed-block">
      <div class="ed-line">
        <span class="ed-num">${i + 1}</span>
        <input type="time" class="ed-in time st-start" value="${esc(s.start)}">
        <span class="ed-sep">～</span>
        <input type="time" class="ed-in time st-end" value="${esc(s.end)}">
      </div>
      <div class="ed-line">
        <input type="text" class="ed-in st-title" placeholder="活動項目名稱" value="${esc(s.title)}">
      </div>
      <div class="ed-line">
        <input type="text" class="ed-in small st-desc" placeholder="補充說明（可留白）" value="${esc(s.desc)}">
        <button class="ed-mini" onclick="edMove(${i},-1)" title="上移">↑</button>
        <button class="ed-mini" onclick="edMove(${i},1)" title="下移">↓</button>
        <button class="ed-mini del" onclick="edDelStep(${i})" title="刪除">✕</button>
      </div>
    </div>`).join('') || '<div class="ed-hint">目前沒有階段，按下面「＋ 新增一個階段」。</div>';
}

function edAddEvent() {
  edCollect();
  const base = tpNow().date;
  edEvents.push({ date: base, name: edEvents[0] ? edEvents[0].name : '中角灣笠螺採集體驗' });
  edEvents.sort((a, b) => a.date < b.date ? -1 : 1);
  edRender(); edMsg('已新增一場，記得按「儲存並同步」');
}
function edDelEvent(i) { edCollect(); edEvents.splice(i, 1); edRender(); }

function edAddStep() {
  edCollect();
  const last = edSteps[edSteps.length - 1];
  const st = last ? last.end : '09:00';
  const en = fmtMin(toMin(st) + 30);
  edSteps.push({ start: st, end: en, title: '新的活動項目', desc: '' });
  edRender(); edMsg('已新增一個階段，記得按「儲存並同步」');
}
function edDelStep(i) { edCollect(); edSteps.splice(i, 1); edRender(); }
function edMove(i, d) {
  edCollect();
  const j = i + d;
  if (j < 0 || j >= edSteps.length) return;
  const t = edSteps[i]; edSteps[i] = edSteps[j]; edSteps[j] = t;
  edRender();
}

function edMsg(t, bad) {
  const el = document.getElementById('edMsg');
  el.textContent = t;
  el.style.color = bad ? '#fca5a5' : '#86efac';
}

function edSave() {
  edCollect();

  const evs = edEvents
    .filter(e => /^\d{4}-\d{2}-\d{2}$/.test(e.date))
    .map(e => ({ date: e.date, name: (e.name || '').trim() || '社區活動' }))
    .sort((a, b) => a.date < b.date ? -1 : 1);

  const sts = edSteps
    .filter(s => /^\d{2}:\d{2}$/.test(s.start) && /^\d{2}:\d{2}$/.test(s.end))
    .map(s => ({
      start: s.start, end: s.end,
      title: (s.title || '').trim() || '活動項目',
      desc: (s.desc || '').trim()
    }));

  if (!sts.length) { edMsg('至少要留一個階段，而且開始／結束時間都要填', true); return; }

  // 時間順序檢查
  for (let i = 0; i < sts.length; i++) {
    if (toMin(sts[i].end) <= toMin(sts[i].start)) {
      edMsg(`第 ${i + 1} 個階段的結束時間要晚於開始時間`, true); return;
    }
    if (i > 0 && toMin(sts[i].start) < toMin(sts[i - 1].start)) {
      edMsg(`第 ${i + 1} 個階段比前一個早，請用 ↑↓ 調整順序`, true); return;
    }
  }

  state.events = evs;
  state.schedule = sts;
  render._scrolled = false;
  touch();
  edLoad();
  edMsg('✅ 已儲存' + (SYNC_URL ? '，並同步給現場所有人' : '（本機模式，只在這支手機生效）'));
}

function edRestoreDefault() {
  state.events = null;
  state.schedule = null;
  render._scrolled = false;
  touch();
  edLoad();
  edMsg('已還原成程式碼裡的預設內容');
}

/* ── 進入主持人模式：網址 ?host=1 或長按標題 1.2 秒 ── */
function openPin() { document.getElementById('pinOverlay').classList.add('open'); document.getElementById('pinInput').focus(); }
function closePin() { document.getElementById('pinOverlay').classList.remove('open'); document.getElementById('pinErr').textContent = ''; }
function checkPin() {
  if (document.getElementById('pinInput').value.trim() === HOST_PIN) {
    sessionStorage.setItem('ws_host', '1');
    closePin(); enableHost();
  } else {
    document.getElementById('pinErr').textContent = '密碼不正確';
  }
}
function enableHost() {
  isHost = true;
  document.getElementById('hostPanel').classList.add('open');
  document.body.style.paddingBottom = '60vh';
  render();
}
function closeHost() {
  document.getElementById('hostPanel').classList.remove('open');
  document.body.style.paddingBottom = '90px';
}

(function initHostEntry() {
  const params = new URLSearchParams(location.search);
  if (sessionStorage.getItem('ws_host') === '1') { setTimeout(enableHost, 100); return; }
  if (params.get('host') === '1') { setTimeout(openPin, 300); }

  let timer = null;
  const h = document.getElementById('pageHeader');
  const start = () => { timer = setTimeout(openPin, 1200); };
  const stop = () => { clearTimeout(timer); };
  h.addEventListener('touchstart', start, { passive: true });
  h.addEventListener('touchend', stop);
  h.addEventListener('touchmove', stop, { passive: true });
  h.addEventListener('mousedown', start);
  h.addEventListener('mouseup', stop);
  h.addEventListener('mouseleave', stop);
})();

document.getElementById('pinInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkPin(); });

/* ── 啟動 ────────────────────────────────────────────── */
loadLocal();
render();
pullRemote();
setInterval(render, 30000);       // 每 30 秒重畫
setInterval(pullRemote, 15000);   // 每 15 秒向雲端拿最新狀態
document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); pullRemote(); } });
</script>
